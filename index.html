<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorry Deepu ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:url("https://res.cloudinary.com/domhkvjks/image/upload/v1773302046/IMG_20260303_235445_238_ppbxsq.jpg") center/cover no-repeat;
overflow:hidden;
}

/* Card */

.container{

position:relative;
z-index:5;

text-align:center;

background:rgba(255,255,255,0.85);

padding:35px;

border-radius:25px;

box-shadow:0 15px 40px rgba(0,0,0,0.4);

width:90%;
max-width:420px;
}

/* GF Photo */

.photo{

width:180px;
height:180px;

border-radius:50%;

object-fit:cover;

border:6px solid #ff3b6b;

box-shadow:0 0 25px #ff3b6b,
0 0 40px pink,
0 0 60px red;

margin-bottom:15px;

animation:pulse 2s infinite;

}

@keyframes pulse{

0%{transform:scale(1)}

50%{transform:scale(1.05)}

100%{transform:scale(1)}

}

h1{
color:#ff3b6b;
margin-bottom:10px;
}

/* Love Message */

p{
font-size:17px;
color:#333;
line-height:1.5;
}

/* Button */

button{

margin-top:15px;

padding:12px 22px;

border:none;

background:#ff3b6b;

color:white;

font-size:16px;

border-radius:10px;

cursor:pointer;

}

button:hover{
background:#ff1f55;
}

/* 3D hearts */

.heart{

position:fixed;

font-size:22px;

color:red;

animation:float 6s linear infinite;

}

@keyframes float{

0%{
transform:translateY(100vh) rotate(0deg) scale(1);
opacity:1;
}

100%{
transform:translateY(-100vh) rotate(360deg) scale(1.5);
opacity:0;
}

}

/* Bouncing text */

.love-text{

position:fixed;

font-size:30px;

font-weight:bold;

color:white;

text-shadow:2px 2px 10px black;

z-index:10;

}

#extra{
margin-top:15px;
font-size:18px;
color:#ff2e63;
font-weight:bold;
}

</style>
</head>

<body>

<div class="love-text" id="love">I Love You Gulabo ❤️</div>

<div class="container">

<!-- GF Photo -->

<img class="photo" src="https://res.cloudinary.com/domhkvjks/image/upload/v1773314813/Screenshot_20260223_143854_fai6vw.jpg">

<h1>Sorry Deepu ❤️</h1>

<p>
Deepu... 💌 <br>
Tum gussa ho sakti ho, par meri duniya tumse hi hai. <br>
Tumhari ek smile meri poori life ko happy bana deti hai. <br>
Please maan jao Gulabo 🌹
</p>

<button onclick="loveClick()">Click karo agar thoda sa bhi pyaar hai 😅</button>

<p id="extra"></p>

</div>

<script>

/* extra love line */

function loveClick(){

document.getElementById("extra").innerHTML=
"Deepu ❤️<br> Tum meri life ka sabse beautiful part ho. <br> I love you Gulabo 💖";

}

/* floating hearts */

setInterval(()=>{

let heart=document.createElement("div");

heart.innerHTML="❤️";

heart.className="heart";

heart.style.left=Math.random()*100+"%";

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),6000);

},700);

/* bouncing love text */

let love=document.getElementById("love");

let x=200;
let y=100;

let dx=2;
let dy=2;

function moveLove(){

let width=window.innerWidth-200;
let height=window.innerHeight-50;

x+=dx;
y+=dy;

if(x<0 || x>width) dx=-dx;
if(y<0 || y>height) dy=-dy;

love.style.left=x+"px";
love.style.top=y+"px";

requestAnimationFrame(moveLove);

}

moveLove();

</script>

</body>
</html>
